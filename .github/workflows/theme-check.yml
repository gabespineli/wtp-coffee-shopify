name: Theme Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@3.93.2
      - name: Validate theme
        run: shopify theme check --fail-level error
